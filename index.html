<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простий Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <button class="theme-btn" onclick="nextTheme()" title="Змінити колір" aria-label="Змінити колір">🎨</button>
        <h1>Калькулятор</h1>
        <input type="text" id="display" class="display" readonly value="0">

        <div class="base-switch" role="group" aria-label="Система числення">
            <button class="base-btn active" data-base="10" onclick="setBase(10)">DEC</button>
            <button class="base-btn" data-base="2" onclick="setBase(2)">BIN</button>
            <button class="base-btn" data-base="16" onclick="setBase(16)">HEX</button>
        </div>

        <div class="converter">
            <div class="converter-row">
                <select id="fromUnit" aria-label="З одиниці" onchange="updateConversion()"></select>
                <button class="swap" onclick="swapUnits()" title="Поміняти місцями">⇄</button>
                <select id="toUnit" aria-label="В одиницю" onchange="updateConversion()"></select>
            </div>
            <div id="conversionResult" class="conversion-result"></div>
        </div>

        <div id="hexKeys" class="hex-keys" hidden>
            <button class="btn number" onclick="appendNumber('A')">A</button>
            <button class="btn number" onclick="appendNumber('B')">B</button>
            <button class="btn number" onclick="appendNumber('C')">C</button>
            <button class="btn number" onclick="appendNumber('D')">D</button>
            <button class="btn number" onclick="appendNumber('E')">E</button>
            <button class="btn number" onclick="appendNumber('F')">F</button>
        </div>

        <div class="buttons">
            <button class="btn function" onclick="clearDisplay()">C</button>
            <button class="btn function" onclick="deleteLast()">⌫</button>
            <button class="btn function" onclick="appendOperator('/')">/</button>
            <button class="btn function" onclick="appendOperator('*')">*</button>
            
            <button class="btn number" onclick="appendNumber('7')">7</button>
            <button class="btn number" onclick="appendNumber('8')">8</button>
            <button class="btn number" onclick="appendNumber('9')">9</button>
            <button class="btn function" onclick="appendOperator('-')">-</button>
            
            <button class="btn number" onclick="appendNumber('4')">4</button>
            <button class="btn number" onclick="appendNumber('5')">5</button>
            <button class="btn number" onclick="appendNumber('6')">6</button>
            <button class="btn function" onclick="appendOperator('+')">+</button>
            
            <button class="btn number" onclick="appendNumber('1')">1</button>
            <button class="btn number" onclick="appendNumber('2')">2</button>
            <button class="btn number" onclick="appendNumber('3')">3</button>
            <button class="btn function" onclick="appendOperator('%')">%</button>
            
            <button class="btn number wide" onclick="appendNumber('0')">0</button>
            <button class="btn number" onclick="appendNumber('.')">.</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
